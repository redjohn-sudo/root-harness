# root-harness: Claude Code works in this repository on GitHub's machines,
# with your Claude Pro/Max plan, when YOU write "@claude" in an issue.
# Installed by root-harness (Settings, Claude on GitHub). Safe to edit.
#
# One secret is needed: CLAUDE_CODE_OAUTH_TOKEN, made on your computer with
# `claude setup-token`, then `gh secret set CLAUDE_CODE_OAUTH_TOKEN -R <repo>`.
name: root-harness · Claude

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    # only the owner of the repository can spend their plan here
    if: |
      (github.event_name == 'issue_comment' && github.event.comment.user.login == github.repository_owner &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner &&
        contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: root-harness-claude-${{ github.event.issue.number }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # Claude may run commands (install, build, test) on this throwaway
          # machine; what it changes arrives as a branch you review.
          claude_args: |
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep,WebFetch,WebSearch"
