<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>root-harness</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--ink:#e6edf3;--mute:#8b949e;--acc:#3f9d84;--acc2:#5fd6a6;--amb:#e3b341}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;height:100vh;display:flex;flex-direction:column}
  header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  header .t{font-weight:700;display:flex;align-items:center;gap:8px}
  header .dot{width:16px;height:16px;border-radius:5px;background:linear-gradient(135deg,var(--acc2),#0ea5e9)}
  header .sub{color:var(--mute);font-size:12px;font-weight:400}
  header button{background:transparent;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
  #feed{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:88%;padding:10px 13px;border-radius:12px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .me{align-self:flex-end;background:#1f6feb33;border:1px solid #1f6feb55}
  .ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
  .card{align-self:flex-start;max-width:88%;border:1px solid var(--line);border-radius:12px;background:#0f1620;overflow:hidden;font-size:14px}
  .card .h{padding:8px 12px;border-bottom:1px solid var(--line);color:var(--mute);display:flex;align-items:center;gap:8px}
  .card .b{padding:10px 12px;font-family:"SF Mono",Menlo,monospace;font-size:13px;color:#c9d1d9;white-space:pre-wrap;word-break:break-word}
  .tool .h{color:var(--acc2)} .result .h{color:var(--mute)}
  .perm{align-self:stretch;border:1px solid #3a2f12;background:#1c160a;border-radius:12px;padding:12px 14px}
  .perm .q{font-size:15px;margin-bottom:6px}.perm .q b{color:var(--amb)}
  .perm .args{font-family:"SF Mono",Menlo,monospace;font-size:12px;color:var(--mute);margin-bottom:10px;white-space:pre-wrap}
  .perm .row{display:flex;gap:10px}
  .perm button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);cursor:pointer;font-weight:600}
  .allow{background:#19392e;border-color:#2f6b52;color:var(--acc2)}
  .deny{background:#2a1512;border-color:#5a2b26;color:#f87171}
  footer{border-top:1px solid var(--line);padding:12px;display:flex;gap:8px}
  #in{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:15px;resize:none;height:44px}
  #send{background:var(--acc);border:none;color:#06130f;border-radius:10px;padding:0 16px;font-weight:700;cursor:pointer}
  .hint{color:var(--mute);font-size:13px;align-self:center;text-align:center;padding:20px;max-width:360px}
</style></head>
<body>
  <header>
    <div class="t"><span class="dot"></span>root-harness <span class="sub">your agent, and what it does</span></div>
    <button onclick="shareChat()">Share</button>
  </header>
  <div id="feed">
    <div class="hint">Talk to your agent below. It can read files, list folders, write files and run commands, and it will ask you before anything that changes your machine.</div>
  </div>
  <footer>
    <textarea id="in" placeholder="Ask your agent something..."></textarea>
    <button id="send" onclick="send()">Send</button>
  </footer>
<script>
const feed = document.getElementById('feed');
function el(cls, html){ const d=document.createElement('div'); d.className=cls; d.innerHTML=html; feed.appendChild(d); feed.scrollTop=feed.scrollHeight; return d; }
function esc(s){ return (s??'').toString().replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function send(){
  const t=document.getElementById('in'); const text=t.value.trim(); if(!text) return;
  el('msg me', esc(text)); t.value='';
  window.pywebview.api.send(text);
}
document.getElementById('in').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});

// Python pushes every step here so you can SEE what the agent is doing.
function onEvent(ev){
  if(ev.type==='text')    el('msg ai', esc(ev.text));
  else if(ev.type==='tool')   el('card tool', `<div class="h">uses tool: ${esc(ev.name)}</div><div class="b">${esc(JSON.stringify(ev.args,null,2))}</div>`);
  else if(ev.type==='result') el('card result', `<div class="h">result</div><div class="b">${esc(ev.text).slice(0,2000)}</div>`);
  else if(ev.type==='permission') permissionCard(ev);
  else if(ev.type==='error') el('card result', `<div class="h" style="color:#f87171">error</div><div class="b">${esc(ev.text)}</div>`);
  // 'done' needs no card
}
function permissionCard(ev){
  const d=el('perm', `<div class="q">The agent wants to: <b>${esc(ev.title)}</b></div>
    <div class="args">${esc(JSON.stringify(ev.args,null,2))}</div>
    <div class="row"><button class="allow">Allow</button><button class="deny">Deny</button></div>`);
  d.querySelector('.allow').onclick=()=>{ window.pywebview.api.permission_answer(ev.id,true); d.querySelector('.row').innerHTML='<span style="color:#5fd6a6">Allowed</span>'; };
  d.querySelector('.deny').onclick =()=>{ window.pywebview.api.permission_answer(ev.id,false); d.querySelector('.row').innerHTML='<span style="color:#f87171">Denied</span>'; };
}

// Share: save the whole conversation as a standalone HTML page to send a friend.
function shareChat(){
  const page = `<!doctype html><meta charset=utf-8><title>root-harness session</title>`+
    `<body style="background:#0d1117;color:#e6edf3;font-family:sans-serif;max-width:720px;margin:auto;padding:24px">`+
    `<h2>A session with my agent</h2>`+feed.innerHTML+`</body>`;
  const a=document.createElement('a');
  a.href='data:text/html;charset=utf-8,'+encodeURIComponent(page);
  a.download='root-harness-session.html'; a.click();
}
</script>
</body></html>
