<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Root">
<meta name="theme-color" content="#0b0f0e">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<title>Root</title>
<style>
:root{--vert:#3f9d84;--vc:#6fd4b6;--lueur:rgba(111,212,182,.38);--ambre:#f0b35a;--encre:#eef3f1;--e2:rgba(238,243,241,.68);--e3:rgba(238,243,241,.42);
  --trait:rgba(255,255,255,.10);--trait2:rgba(255,255,255,.24);--verre:rgba(14,22,20,.55);--toi:rgba(63,157,132,.26);--r:20px;
  --ease:cubic-bezier(.16,1,.3,1);--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0f0e}
body{color:var(--encre);font:16px -apple-system,"SF Pro Text",system-ui,sans-serif;overflow:hidden;
  background:radial-gradient(700px 420px at 15% -10%,#123a30,rgba(18,58,48,0) 60%),radial-gradient(600px 400px at 110% 110%,#10261f,rgba(16,38,31,0) 55%),#0b0f0e}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* sign in */
#ecran{position:fixed;inset:0;display:none;place-items:center;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
#ecran.on{display:grid}
.carte{width:100%;max-width:380px;text-align:center;border:1px solid var(--trait);border-radius:26px;padding:28px 22px 22px;background:var(--verre);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);animation:monte .7s var(--ease)}
@keyframes monte{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.logo{width:60px;height:60px;border-radius:18px;margin:0 auto 14px;display:grid;place-items:center;font-weight:800;font-size:24px;color:#06130f;
  background:linear-gradient(135deg,var(--vc),#0ea5e9);box-shadow:0 0 34px var(--lueur)}
.carte h2{font-size:21px;margin-bottom:6px}.carte p{color:var(--e2);font-size:14.5px;line-height:1.45;margin-bottom:16px}
.carte input{width:100%;font-size:16px;background:rgba(0,0,0,.3);border:1px solid var(--trait);border-radius:13px;padding:13px 14px;color:var(--encre);outline:0;margin-bottom:10px}
.carte input:focus{border-color:rgba(111,212,182,.55)}
.go{width:100%;padding:14px;border-radius:14px;font-weight:700;color:#06130f;background:var(--vc);box-shadow:0 0 22px var(--lueur);margin-top:4px}
.go:disabled{opacity:.75}
.err{color:#f6b3a0;font-size:13.5px;min-height:18px;margin:2px 0 6px}
.petit{color:var(--e3);font-size:12.5px;margin-top:14px;line-height:1.45}.lien{color:var(--e3);font-size:13.5px;margin-top:14px;text-decoration:underline}
.barre{height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;margin:0 0 10px;display:none}.barre.on{display:block}
.barre i{display:block;height:100%;width:0;background:var(--vc);transition:width .3s}
.secoue{animation:secoue .45s}@keyframes secoue{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
/* app */
#appli{position:fixed;inset:0;display:none;flex-direction:column}#appli.on{display:flex}
header{margin:calc(10px + env(safe-area-inset-top)) 16px 0;padding:10px 12px;border-radius:var(--r);border:1px solid var(--trait);background:var(--verre);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;align-items:center;gap:11px}
header .logo{width:40px;height:40px;border-radius:12px;font-size:17px;margin:0;flex:none}
.id{flex:1;min-width:0}.id b{font-size:15.5px}
.ligne{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--e2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.point{width:8px;height:8px;border-radius:50%;flex:none;background:var(--e3)}
.point.ok{background:var(--vc);box-shadow:0 0 9px var(--vc)}.point.travail,.point.attente{background:var(--ambre);box-shadow:0 0 9px var(--ambre);animation:pulse 1.4s infinite}
.point.off{background:#f87171}
@keyframes pulse{50%{opacity:.35}}
.icone{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--e2);border:1px solid var(--trait)}
.icone svg{width:18px;height:18px}
#sous{margin:6px 22px 0;font:12px var(--mono);color:var(--e3);display:flex;gap:8px;white-space:nowrap;overflow:hidden}
#fil,#fil-gh{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
#fil>*,#fil-gh>*{flex-shrink:0;animation:monte .45s var(--ease)}
#fil-gh{display:none} body.gh #fil{display:none} body.gh #fil-gh{display:flex}
#modes{display:flex;gap:6px;margin:10px 16px 0;padding:4px;border-radius:14px;border:1px solid var(--trait);background:var(--verre)}
#modes button{flex:1;padding:8px;border-radius:10px;font-size:13.5px;color:var(--e2);transition:background .25s,color .25s}
#modes button.on{background:rgba(63,157,132,.25);color:var(--encre)}
.carte-a.gh{border-color:rgba(111,212,182,.4);background:rgba(14,40,34,.55)}
.carte-a .aide{font-size:13.5px;color:var(--e2);line-height:1.5;margin:6px 0 10px}
.carte-a a,.msg a{color:var(--vc)}
.carte-a input{width:100%;font-size:16px;background:rgba(0,0,0,.3);border:1px solid var(--trait);border-radius:12px;padding:11px 12px;color:var(--encre);outline:0;margin:4px 0}
.carte-a .err{color:#f6b3a0;font-size:13px;min-height:4px;margin:4px 0}
.msg{max-width:88%;font-size:15.5px;line-height:1.5;padding:10px 14px;border:1px solid var(--trait);word-break:break-word}
.msg.toi{align-self:flex-end;background:var(--toi);border-radius:var(--r) var(--r) 6px var(--r);white-space:pre-wrap}
.msg.root{align-self:flex-start;background:var(--verre);border-radius:6px var(--r) var(--r) var(--r);border-left:3px solid var(--vc)}
.msg.root p{margin-bottom:7px}.msg.root p:last-child{margin:0}
.msg code{font:13px var(--mono);background:rgba(255,255,255,.08);padding:1px 4px;border-radius:5px}
.msg pre,.carte-a pre{font:12px var(--mono);background:rgba(0,0,0,.3);border-radius:9px;padding:9px;overflow-x:auto;white-space:pre-wrap;margin:6px 0}
.msg.erreur{align-self:flex-start;color:#f6b3a0;background:rgba(60,20,20,.4);border-radius:var(--r)}
.outil{align-self:flex-start;max-width:88%;font-size:13px;padding:8px 12px;border-radius:13px;border:1px solid var(--trait);background:var(--verre);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.outil .args{font:12px var(--mono);color:var(--e3)}
.outil .rond{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid var(--trait2);border-top-color:var(--vc);margin-right:6px;vertical-align:-1px;animation:tourne .8s linear infinite}
.outil.fait .rond{border:0;background:var(--vc);animation:none}@keyframes tourne{to{transform:rotate(360deg)}}
.outil .detail{font:11.5px var(--mono);color:var(--e2);white-space:pre-wrap;margin-top:6px;max-height:160px;overflow:hidden}
.carte-a{align-self:stretch;border:1px solid rgba(240,179,90,.45);border-radius:var(--r);padding:13px 14px;background:rgba(40,30,12,.55)}
.carte-a .q{font-size:15px;margin-bottom:8px}.carte-a .q b{color:var(--ambre)}
.row{display:flex;gap:10px;margin-top:8px}.row button{flex:1;padding:12px;border-radius:12px;font-weight:600;border:1px solid var(--trait)}
.oui{color:var(--vc);background:rgba(63,157,132,.2);border-color:rgba(111,212,182,.45)!important}.non{color:#f87171;background:rgba(248,113,113,.12)}
.opt{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:12px;border:1px solid var(--trait);margin-bottom:7px;background:rgba(255,255,255,.04)}
.opt.on{border-color:var(--vc);background:rgba(63,157,132,.22)}.opt small{display:block;color:var(--e3);font-size:12.5px}
.verdict{font-weight:600;margin-top:6px}.verdict.v{color:var(--vc)}.verdict.r{color:#f87171}
footer{margin:0 16px calc(10px + env(safe-area-inset-bottom));padding:7px 7px 7px 15px;border-radius:24px;border:1px solid var(--trait);background:var(--verre);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;align-items:flex-end;gap:8px}
#entree{flex:1;font:16px -apple-system,system-ui,sans-serif;background:none;border:0;outline:0;color:var(--encre);resize:none;height:36px;max-height:140px;padding:8px 0;line-height:20px}
#envoyer{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;color:#06120e;background:var(--vc);box-shadow:0 0 18px var(--lueur);transition:transform .15s}
#envoyer:active{transform:scale(.9)}
#envoyer .stop{display:none}body.travail #envoyer .stop{display:block}body.travail #envoyer .fleche{display:none}
</style></head>
<body>
<div id="ecran"></div>
<div id="appli">
  <header><div class="logo">R</div>
    <div class="id"><b>Root</b> <span style="color:var(--e3);font-size:13px">· <span id="qui"></span></span>
      <div class="ligne"><span class="point" id="point"></span><span id="etat"></span></div></div>
    <button class="icone" id="nouveau" title="New chat"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button class="icone" id="verrou" title="Lock"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V8a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.8"/></svg></button>
  </header>
  <div id="modes"><button data-m="computer" class="on">Your computer</button><button data-m="github">GitHub</button></div>
  <div id="sous"><span id="modele"></span><span id="contexte"></span></div>
  <div id="fil"></div><div id="fil-gh"></div>
  <footer><textarea id="entree" rows="1" placeholder="Ask your agent..."></textarea>
    <button id="envoyer" title="Send"><svg class="fleche" width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="stop" width="13" height="13" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" fill="currentColor"/></svg></button></footer>
</div>
<script src="app.js"></script>
</body></html>
